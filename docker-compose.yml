services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beend_fila}
      POSTGRES_USER: ${POSTGRES_USER:-beend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beend_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
